name: Final Build CI

on:
  push:
    branches:
      - agent/final-production-build
  workflow_dispatch:

concurrency:
  group: final-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/erp_by_anmol_ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-secret-change-only-in-ci-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-change-only-in-ci-1234567890
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-change-only-1234567890
      WORKER_CALLBACK_SECRET: ci-worker-callback-secret-change-only-1234567890
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      PASSWORD_RESET_URL: http://localhost:5173/reset-password
      FILE_SCAN_MODE: optional
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify repository structure
        run: npm run verify --if-present

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test all workspaces
        run: npm run test --workspaces --if-present

      - name: Build all workspaces
        run: npm run build --workspaces --if-present
